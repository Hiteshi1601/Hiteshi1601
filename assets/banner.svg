<svg fill="none" viewBox="0 0 1200 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-main { fill: #070a12; }
    .title-text {
      font-family: 'Segoe UI', Ubuntu, 'Fira Code', sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: 3px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', Ubuntu, 'Fira Code', sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #00f2fe;
      letter-spacing: 1.5px;
    }
    .wave-path { fill: url(#wave-gradient); }
  </style>

  <defs>
    <!-- Dark Capsule Gradient -->
    <linearGradient id="capsule-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#120c24" />
    </linearGradient>

    <!-- Waving Bottom Gradient -->
    <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#7f00ff" />
      <stop offset="70%" stop-color="#e100ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="220" rx="10" fill="url(#capsule-bg)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="600" cy="90" r="180" fill="#7f00ff" opacity="0.15" filter="url(#glow-effect)" />
  <circle cx="300" cy="80" r="120" fill="#00f2fe" opacity="0.1" filter="url(#glow-effect)" />

  <!-- Title Text: HITESHI MUDHAM -->
  <text x="600" y="95" text-anchor="middle" class="title-text" filter="url(#glow-effect)">HITESHI MUDHAM</text>

  <!-- Subtitle Text -->
  <text x="600" y="145" text-anchor="middle" class="subtitle-text">Aspiring AI Engineer  •  Full Stack Developer  •  ML Explorer</text>

  <!-- Waving Bottom Curve -->
  <path d="M 0 170 C 250 140, 450 200, 700 160 C 950 120, 1100 180, 1200 160 L 1200 220 L 0 220 Z" class="wave-path" opacity="0.9" />
</svg>

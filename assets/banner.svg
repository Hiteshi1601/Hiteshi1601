<svg fill="none" viewBox="0 0 1200 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .title {
      font-family: 'Segoe UI', Ubuntu, 'Fira Code', Roboto, sans-serif;
      font-weight: 800;
      font-size: 48px;
      fill: #ffffff;
      letter-spacing: 4px;
    }
    .subtitle {
      font-family: 'Segoe UI', Ubuntu, 'Fira Code', Roboto, sans-serif;
      font-weight: 600;
      font-size: 18px;
      fill: #00f2fe;
      letter-spacing: 2px;
    }
    .accent-cyan { fill: url(#cyan-purple-grad); }
    .grid-line { stroke: rgba(0, 242, 254, 0.08); stroke-width: 1; }
    .glow-node { fill: #00f2fe; opacity: 0.6; }
  </style>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#140c24" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>

    <!-- Accent Waving Line Gradient -->
    <linearGradient id="cyan-purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#7f00ff" />
      <stop offset="100%" stop-color="#e100ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="250" rx="12" fill="url(#bg-grad)" />

  <!-- Cyberpunk Background Grid -->
  <line x1="0" y1="50" x2="1200" y2="50" class="grid-line" />
  <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
  <line x1="0" y1="150" x2="1200" y2="150" class="grid-line" />
  <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />

  <line x1="200" y1="0" x2="200" y2="250" class="grid-line" />
  <line x1="400" y1="0" x2="400" y2="250" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="250" class="grid-line" />
  <line x1="800" y1="0" x2="800" y2="250" class="grid-line" />
  <line x1="1000" y1="0" x2="1000" y2="250" class="grid-line" />

  <!-- Decorative Neural Nodes -->
  <circle cx="200" cy="50" r="3" class="glow-node" />
  <circle cx="400" cy="150" r="3" class="glow-node" />
  <circle cx="800" cy="100" r="3" class="glow-node" />
  <circle cx="1000" cy="200" r="3" class="glow-node" />

  <!-- Futuristic Corner Frames -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#00f2fe" stroke-width="3" fill="none" opacity="0.8" />
  <path d="M 1180 50 L 1180 20 L 1150 20" stroke="#7f00ff" stroke-width="3" fill="none" opacity="0.8" />
  <path d="M 20 200 L 20 230 L 50 230" stroke="#7f00ff" stroke-width="3" fill="none" opacity="0.8" />
  <path d="M 1180 200 L 1180 230 L 1150 230" stroke="#00f2fe" stroke-width="3" fill="none" opacity="0.8" />

  <!-- Title Text -->
  <text x="600" y="115" text-anchor="middle" class="title" fill="url(#title-grad)" filter="url(#glow)">HITESHI MUDHAM</text>

  <!-- Subtitle Text -->
  <text x="600" y="165" text-anchor="middle" class="subtitle">AI DEVELOPER (2027 BATCH)  •  OPEN-SOURCE LLMs (QWEN)  •  AGENTIC AI &amp; RAG</text>

  <!-- Waving Bottom Glow Bar -->
  <path d="M 0 235 Q 300 220 600 235 T 1200 235 L 1200 250 L 0 250 Z" fill="url(#cyan-purple-grad)" opacity="0.9" />
</svg>

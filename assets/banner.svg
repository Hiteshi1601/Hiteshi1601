<svg fill="none" viewBox="0 0 1200 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: 2.5px;
    }
    .banner-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 16px;
      fill: #ffffff;
      letter-spacing: 1.2px;
      opacity: 0.95;
    }
  </style>

  <defs>
    <!-- Purple to Crimson Maroon Gradient matching screenshot -->
    <linearGradient id="purple-maroon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c1248" />
      <stop offset="30%" stop-color="#6a1542" />
      <stop offset="65%" stop-color="#8a1837" />
      <stop offset="100%" stop-color="#a61c33" />
    </linearGradient>
  </defs>

  <!-- Waving Banner Shape -->
  <path d="M 0 0 L 1200 0 L 1200 185 C 1000 195, 800 160, 600 175 C 400 190, 200 165, 0 175 Z" fill="url(#purple-maroon-grad)" />

  <!-- Center Text: HITESHI MUDHAM -->
  <text x="600" y="92" text-anchor="middle" class="banner-title">HITESHI MUDHAM</text>

  <!-- Subtitle Text: Aspiring AI Engineer • Full Stack Developer • ML Explorer -->
  <text x="600" y="138" text-anchor="middle" class="banner-subtitle">Aspiring AI Engineer • Full Stack Developer • ML Explorer</text>
</svg>
